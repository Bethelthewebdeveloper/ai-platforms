<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07111f">

    <title>BusinessGrowth | Individual Dashboard</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Dashboard CSS -->
    <link rel="stylesheet" href="individual.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="dashboard-container">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <a href="../index.html" class="brand">
            <span class="brand-icon">
                <i class="bi bi-graph-up-arrow"></i>
            </span>

            <span>Business<span class="brand-highlight">Growth</span></span>
        </a>

        <div class="sidebar-label">WORKSPACE</div>

        <nav class="sidebar-nav">

            <a href="#overview" class="nav-link active">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>Overview</span>
            </a>

            <a href="#ai-tools" class="nav-link">
                <i class="bi bi-stars"></i>
                <span>AI Tools</span>
            </a>

            <a href="#workspace" class="nav-link">
                <i class="bi bi-chat-square-text"></i>
                <span>AI Workspace</span>
            </a>

            <a href="#projects" class="nav-link">
                <i class="bi bi-folder2-open"></i>
                <span>My Projects</span>
            </a>

            <a href="#favorites" class="nav-link">
                <i class="bi bi-bookmark"></i>
                <span>Favorites</span>
            </a>

            <a href="#history" class="nav-link">
                <i class="bi bi-clock-history"></i>
                <span>History</span>
            </a>

        </nav>

        <div class="sidebar-label">PREFERENCES</div>

        <nav class="sidebar-nav">

            <a href="#notifications" class="nav-link">
                <i class="bi bi-bell"></i>
                <span>Notifications</span>
            </a>

            <a href="#settings" class="nav-link">
                <i class="bi bi-gear"></i>
                <span>Settings</span>
            </a>

        </nav>

        <div class="sidebar-bottom">

            <div class="upgrade-card">
                <i class="bi bi-lightning-charge-fill"></i>

                <h3>Unlock More</h3>

                <p>Discover more ways to work smarter with AI.</p>

                <button type="button" id="upgradeButton">
                    Explore Plans
                </button>
            </div>

            <button class="profile-card" id="profileToggle" type="button">

                <div class="avatar" id="sidebarAvatar">U</div>

                <div class="profile-info">
                    <strong id="sidebarUserName">User</strong>
                    <span>Individual Account</span>
                </div>

                <i class="bi bi-three-dots"></i>

            </button>

        </div>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main-content" id="overview">

        <!-- TOPBAR -->

        <header class="topbar">

            <div class="topbar-left">

                <button
                    class="icon-button menu-toggle"
                    id="menuToggle"
                    type="button"
                    aria-label="Toggle navigation"
                    aria-expanded="false">

                    <i class="bi bi-list"></i>

                </button>

                <div class="breadcrumb">
                    <span>Dashboard</span>
                    <i class="bi bi-chevron-right"></i>
                    <strong>Overview</strong>
                </div>

            </div>

            <div class="topbar-actions">

                <label class="search-box">

                    <i class="bi bi-search"></i>

                    <input
                        type="search"
                        id="dashboardSearch"
                        placeholder="Search your workspace..."
                        aria-label="Search dashboard">

                    <kbd> / </kbd>

                </label>

                <div class="dropdown-wrap">

                    <button
                        class="icon-button"
                        id="notificationToggle"
                        type="button"
                        aria-label="Notifications"
                        aria-expanded="false">

                        <i class="bi bi-bell"></i>

                        <span class="notification-dot"></span>

                    </button>

                    <div class="dropdown-panel"
                        id="notificationPanel" hidden>

                        <h3>Notifications</h3>

                        <p class="empty-state">
                            You're all caught up!
                        </p>

                    </div>

                </div>

                <button
                    class="icon-button"
                    id="themeToggle"
                    type="button"
                    aria-label="Toggle theme">

                    <i class="bi bi-moon-stars"></i>

                </button>

            </div>

        </header>
